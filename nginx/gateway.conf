server {
    listen 80;

    location /admin-dashboard {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /admin-dashboard/index.html;
    }

    location /admin-dashboard/api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_service "http://admin-backend:8124";

        rewrite ^/admin-dashboard/api/(.*)$ /api/$1 break;
        proxy_pass $backend_service;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin-dashboard/socket.io/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_service "http://admin-backend:8124";

        rewrite ^/admin-dashboard/socket.io/(.*)$ /socket.io/$1 break;
        proxy_pass $backend_service;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
