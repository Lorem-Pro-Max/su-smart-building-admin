volumes:
  frontend_dist:

services:
  admin-redis:
    image: redis:alpine
    restart: always

  admin-frontend:
    build:
      context: ./client
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    volumes:
      - frontend_dist:/shared-assets
    command: sh -c "cp -rv /app/dist/. /shared-assets/"

  admin-backend:
    build: ./server
    restart: always
    ports:
      - "8124:8124"
    environment:
      - SERVER_PORT=${SERVER_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - IOT_SERVER_URL=${IOT_SERVER_URL}
      - WEBSOCKET_URL=${WEBSOCKET_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    depends_on:
      - admin-redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

  admin-nginx:
    image: nginx:stable-alpine
    ports:
      - "7185:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html/admin-dashboard:ro
    depends_on:
      - admin-backend
    restart: always
