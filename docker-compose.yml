volumes:
  frontend_dist:
  pgadmin_data:

services:
  admin-redis:
    image: redis:alpine
    container_name: web-app-redis
    restart: always

  admin-frontend:
    build:
      context: ./client
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    container_name: web-app-admin-frontend
    volumes:
      - frontend_dist:/shared-assets
    command: sh -c "cp -rv /app/dist/. /shared-assets/"

  admin-backend:
    build: ./server
    container_name: web-app-admin-backend
    restart: always
    ports:
      - "8124:8124"
    environment:
      - SERVER_PORT=${SERVER_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - IOT_SERVER_URL=${IOT_SERVER_URL}
      - WEBSOCKET_URL=${WEBSOCKET_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    depends_on:
      - admin-redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "55.sc.su.ac.th:host-gateway"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: web-app-pgadmin
    restart: always
    profiles: ["tools"]
    network_mode: host
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
      - PGADMIN_LISTEN_ADDRESS=${PGADMIN_LISTEN_ADDRESS:-127.0.0.1}
      - PGADMIN_LISTEN_PORT=5050
      - PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION=True
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  admin-nginx:
    image: nginx:stable-alpine
    container_name: web-app-admin-nginx
    ports:
      - "7185:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html/admin-dashboard:ro
    depends_on:
      - admin-backend
    restart: always
