volumes:
  frontend_dist:

services:
  admin-frontend:
    build:
      context: ./client
      args:
        - VITE_API_BASE_URL=
    volumes:
      - frontend_dist:/shared-assets
    command: sh -c "cp -rv /app/dist/. /shared-assets/"

  admin-backend:
    build: ./server
    restart: always
    environment:
      - SERVER_PORT=8124
      - DATABASE_URL=
      - IOT_SERVER_URL=
    extra_hosts:
      - "host.docker.internal:host-gateway"

  admin-nginx:
    image: nginx:stable-alpine
    ports:
      - "7185:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html/admin-dashboard:ro
    depends_on:
      - admin-backend
    restart: always
